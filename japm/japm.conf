# japm global defaults. Per-instance values in configs/<name>.json win.
[locations]
# GameData dir holding linuxjampded + jampgamei386.so. Empty = auto-detect
# (JAPLUS_HOME env also works).
ja_path =
# Alternate config dir. Empty = japm/configs.
config_path =

[dedicated]
# Engine binary. Empty = auto-detect (PATH, then <GameData>/linuxjampded).
engine =
# Mod dir under GameData. JA+ uses "japlus".
fs_game = japlus
